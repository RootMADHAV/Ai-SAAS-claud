[project]
name = "security-platform-backend"
version = "0.1.0"
description = "AI-assisted vulnerability discovery and reporting platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-ulid>=3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "minio>=7.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.120",
    "celery>=5.4",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
# Grows per milestone. Do not add a dependency here until code in this
# repo actually imports it -- an unused entry is a lie about what's built.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "celery-types>=0.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 (no function calls in argument defaults) is a general anti-pattern
# check that doesn't know FastAPI gives `Depends(...)` special meaning in
# a parameter default -- this is the standard, required FastAPI
# dependency-injection idiom (used throughout FastAPI's own
# documentation), not the mutable-default-argument bug B008 exists to
# catch. Scoped to exactly the package that defines/consumes
# `Depends(...)` defaults, not project-wide.
"app/api/**/*.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running PostgreSQL instance",
]

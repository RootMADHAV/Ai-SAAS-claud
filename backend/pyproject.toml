[project]
name = "security-platform-backend"
version = "0.1.0"
description = "AI-assisted vulnerability discovery and reporting platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-ulid>=3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "minio>=7.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.120",
    "celery[redis]>=5.4",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
# Phase 5 (RAG): sentence-transformers + qdrant-client, split out of the
# base `dependencies` list above in Milestone 5 -- only
# worker_role=ingestion_worker ever constructs either adapter
# (app/workers/tasks.py's _build_analysis_service), so only that
# process's Docker image needs them installed. Keeping them in the base
# list would put both, including the CPU-only-by-design
# sentence-transformers/torch stack (Technical Debt #19), on
# worker_role=api's image for no reason. See backend/Dockerfile's
# INSTALL_RAG_DEPENDENCIES build arg for where this group is actually
# consumed, and `dev` below for why local/CI test runs still get it
# unconditionally.
rag = [
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
]

# Grows per milestone. Do not add a dependency here until code in this
# repo actually imports it -- an unused entry is a lie about what's built.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "celery-types>=0.22",
    # Self-referential extra: every test file that imports Phase 5 code
    # (test_sentence_transformer_provider.py, test_qdrant_vector_store.py,
    # test_ingest_cwe_top25.py, test_analysis_service.py, and Milestone
    # 5's own worker-composition tests) needs `rag` importable regardless
    # of which Docker image would eventually run that code for real --
    # `pip install -e ".[dev]"` is this project's one established
    # local/CI verification command (PROJECT_STATE.md section 11), and
    # it must keep working unchanged, not silently start failing at
    # test-collection time because sentence-transformers/qdrant-client
    # moved out of the base dependency list this milestone.
    "security-platform-backend[rag]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 (no function calls in argument defaults) is a general anti-pattern
# check that doesn't know FastAPI gives `Depends(...)` special meaning in
# a parameter default -- this is the standard, required FastAPI
# dependency-injection idiom (used throughout FastAPI's own
# documentation), not the mutable-default-argument bug B008 exists to
# catch. Scoped to exactly the package that defines/consumes
# `Depends(...)` defaults, not project-wide.
"app/api/**/*.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running PostgreSQL instance",
]
